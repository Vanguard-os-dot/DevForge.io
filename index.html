<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>DevForge.io</title>
 <style>
 :root {
 --bg-color: #0f0f11;
 --drawer-width: 280px;
 --card-bg: #18181b;
 --text-color: #f4f4f5;
 --accent-color: #39ff14;
 --border-color: #27272a;
 }
 * { box-sizing: border-box; }
 body {
 margin: 0;
 font-family: 'Courier New', Courier, monospace;
 background-color: var(--bg-color);
 color: var(--text-color);
 display: flex;
 justify-content: center;
 align-items: center;
 height: 100vh;
 overflow: hidden;
 }

 .workspace {
 width: 90vw;
 max-width: 1300px;
 height: 90vh;
 background-color: var(--card-bg);
 border: 1px solid var(--border-color);
 border-radius: 12px;
 display: flex;
 flex-direction: column;
 position: relative;
 box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
 overflow: hidden;
 }

 .workspace-header {
 height: 50px;
 background: #121215;
 border-bottom: 1px solid var(--border-color);
 display: flex;
 align-items: center;
 justify-content: center;
 position: relative;
 padding: 0 20px;
 }
 .workspace-title {
 font-size: 15px;
 font-weight: bold;
 color: var(--accent-color);
 letter-spacing: 1px;
 text-align: center;
 }

 .ai-chat-bar {
 background: #151518;
 border-bottom: 1px solid var(--border-color);
 padding: 10px 15px;
 display: flex;
 gap: 10px;
 align-items: center;
 }
 .ai-chat-bar input {
 flex: 1;
 background: #0b0b0d;
 border: 1px solid var(--border-color);
 color: var(--text-color);
 padding: 8px 12px;
 font-family: monospace;
 font-size: 13px;
 border-radius: 4px;
 outline: none;
 }
 .ai-chat-bar input:focus {
 border-color: var(--accent-color);
 }
 .ai-chat-bar button {
 background: transparent;
 border: 1px solid var(--border-color);
 color: var(--accent-color);
 padding: 8px 14px;
 border-radius: 4px;
 cursor: pointer;
 font-family: monospace;
 font-size: 13px;
 }
 .ai-chat-bar button:hover {
 background: var(--accent-color);
 color: #000;
 }

 .workspace-body {
 flex: 1;
 display: flex;
 position: relative;
 overflow: hidden;
 }

 .editor-pane {
 flex: 1;
 display: flex;
 flex-direction: column;
 background-color: #000;
 width: 100%;
 height: 100%;
 }
 .pane-header {
 background: #141417;
 padding: 8px 15px;
 font-size: 11px;
 color: #71717a;
 border-bottom: 1px solid var(--border-color);
 text-transform: uppercase;
 letter-spacing: 1px;
 display: flex;
 justify-content: space-between;
 align-items: center;
 }
 .emulate-btn {
 background: var(--accent-color);
 color: #000;
 border: none;
 padding: 2px 8px;
 font-size: 10px;
 font-family: monospace;
 font-weight: bold;
 border-radius: 3px;
 cursor: pointer;
 }
 .emulate-btn:hover {
 opacity: 0.8;
 }

 textarea {
 flex: 1;
 background: transparent;
 color: var(--accent-color);
 border: none;
 padding: 15px;
 font-family: monospace;
 font-size: 13px;
 resize: none;
 outline: none;
 width: 100%;
 }

 .preview-overlay {
 position: absolute;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 background: #fff;
 z-index: 50;
 display: none;
 flex-direction: column;
 }
 .preview-overlay.active {
 display: flex;
 }
 .preview-toolbar {
 background: #121215;
 padding: 8px 15px;
 display: flex;
 justify-content: space-between;
 align-items: center;
 border-bottom: 1px solid var(--border-color);
 }
 .preview-toolbar span {
 font-size: 12px;
 color: var(--accent-color);
 font-weight: bold;
 }
 .close-preview {
 background: transparent;
 border: 1px solid var(--border-color);
 color: var(--text-color);
 padding: 4px 10px;
 border-radius: 4px;
 cursor: pointer;
 font-family: monospace;
 font-size: 12px;
 }
 .close-preview:hover {
 border-color: var(--accent-color);
 color: var(--accent-color);
 }
 iframe {
 flex: 1;
 border: none;
 width: 100%;
 height: 100%;
 background: #fff;
 }

 .drawer {
 position: absolute;
 top: 0;
 right: calc(-1 * var(--drawer-width));
 width: var(--drawer-width);
 height: 100%;
 background-color: #141417;
 border-left: 1px solid var(--border-color);
 transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
 display: flex;
 flex-direction: column;
 padding: 20px;
 z-index: 100;
 box-shadow: -10px 0 30px rgba(0,0,0,0.5);
 }
 .drawer.open {
 right: 0;
 }
 .drawer-tab {
 position: absolute;
 left: -14px;
 top: 50%;
 transform: translateY(-50%);
 width: 14px;
 height: 40px;
 background: var(--border-color);
 border-top-left-radius: 4px;
 border-bottom-left-radius: 4px;
 cursor: pointer;
 display: flex;
 align-items: center;
 justify-content: center;
 transition: background 0.2s;
 }
 .drawer-tab:hover {
 background: var(--accent-color);
 }
 .drawer-tab::after {
 content: '';
 width: 4px;
 height: 4px;
 border-right: 2px solid var(--bg-color);
 border-bottom: 2px solid var(--bg-color);
 transform: rotate(-45deg);
 }
 .drawer h3 {
 margin-top: 0;
 color: var(--accent-color);
 font-size: 13px;
 border-bottom: 1px solid var(--border-color);
 padding-bottom: 10px;
 text-transform: uppercase;
 letter-spacing: 1px;
 }
 .drawer-item {
 padding: 10px 0;
 cursor: pointer;
 opacity: 0.7;
 font-size: 12px;
 border-bottom: 1px dashed var(--border-color);
 transition: opacity 0.2s;
 }
 .drawer-item:hover {
 opacity: 1;
 color: var(--accent-color);
 }
 </style>
</head>
<body>

 <div class="workspace">
 <div class="workspace-header">
 <div class="workspace-title">DevForge.io</div>
 </div>

 <div class="ai-chat-bar">
 <input type="text" id="aiPromptInput" placeholder="Tell AI what to generate or fix (type 'emulate' to render)...">
 <button onclick="handleAIChat()">Send</button>
 </div>

 <div class="workspace-body">
 <div class="editor-pane">
 <div class="pane-header">
 <span>Code Editor</span>
 <button class="emulate-btn" onclick="openPreview()">Emulate</button>
 </div>
 <textarea id="codeEditor" placeholder="Write or paste HTML code here..."></textarea>
 </div>

 <div class="preview-overlay" id="previewOverlay">
 <div class="preview-toolbar">
 <span>EMULATION PREVIEW</span>
 <button class="close-preview" onclick="closePreview()">Close [X]</button>
 </div>
 <iframe id="previewFrame"></iframe>
 </div>

 <div class="drawer" id="sideDrawer">
 <div class="drawer-tab" onclick="document.getElementById('sideDrawer').classList.toggle('open')"></div>
 <h3>Navigation</h3>
 <div class="drawer-item">Projects</div>
 <div class="drawer-item">Snippets</div>
 <div class="drawer-item">Terminal Logs</div>
 <div class="drawer-item">Settings</div>
 </div>
 </div>
 </div>

 <script>
 const codeEditor = document.getElementById('codeEditor');
 const previewFrame = document.getElementById('previewFrame');
 const previewOverlay = document.getElementById('previewOverlay');
 const aiPromptInput = document.getElementById('aiPromptInput');

 function openPreview() {
 const code = codeEditor.value;
 const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
 doc.open();
 doc.write(code);
 doc.close();
 previewOverlay.classList.add('active');
 }

 function closePreview() {
 previewOverlay.classList.remove('active');
 }

 function handleAIChat() {
 const text = aiPromptInput.value.trim().toLowerCase();
 if (text === 'emulate' || text.includes('emulate')) {
 openPreview();
 } else {
 codeEditor.value = `<!-- AI Response for: "${aiPromptInput.value}" -->\n<div style="font-family:monospace; padding:20px; background:#121212; color:#39ff14; height:100vh; box-sizing:border-box;">\n  <h2>Emulated Output</h2>\n  <p>Processed your instruction successfully.</p>\n</div>`;
 openPreview();
 }
 aiPromptInput.value = '';
 }
 </script>
</body>
</html>
